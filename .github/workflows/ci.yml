name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "package.json"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

- name: Update the /etc/timezone to Etc/UTC
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/timezone
    content: "Etc/UTC\n"
    owner: root
    group: root

- name: Create symlink /etc/localtime to /usr/share/zoneinfo/Etc/UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    state: link
    force: true
    owner: root
    group: root

site_name: Puls
site_description: Intent-driven infrastructure-as-code. Describe what you want - Puls figures out create, update, or skip.
site_url: https://puls-docs.web.app
repo_url: https://github.com/nolimitcity/puls
repo_name: puls

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: deep purple
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Decorators: decorators.md
  - Providers:
      - AWS: providers/aws.md
      - Proxmox: providers/proxmox.md
      - DigitalOcean: providers/digitalocean.md
      - Firebase: providers/firebase.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md

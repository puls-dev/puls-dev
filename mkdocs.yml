site_name: Pulsdev.io
site_description: Intent-driven infrastructure-as-code. Describe what you want - Puls figures out create, update, or skip.
site_url: https://pulsdev.io
repo_url: https://github.com/puls-dev/puls-dev
repo_name: puls-dev

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: deep purple
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: blog/posts

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables

nav:
  - Home: index.md
  - Why Puls?: why.md
  - Blog: blog/index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Decorators: decorators.md
  - Stack Outputs: stack-outputs.md
  - Lifecycle Hooks: hooks.md
  - Secrets at Deploy Time: secrets.md
  - Multi-Region Deployments: multiregion.md
  - Parallel Deployments: parallel-deployment.md
  - Resource Adoption: resource-adoption.md
  - Drift Detection: drift-detection.md
  - Policy-as-Code: policy.md
  - GitHub Actions: github-actions.md
  - Providers:
      - AWS: providers/aws.md
      - Proxmox: providers/proxmox.md
      - DigitalOcean: providers/digitalocean.md
      - Firebase: providers/firebase.md
      - GCP: providers/gcp.md
      - Cloudflare: providers/cloudflare.md
      - Azure: providers/azure.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md
